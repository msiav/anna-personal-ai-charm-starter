name: Feature idea
description: Suggest an improvement for this personal AI companion starter.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share the problem you want to solve. Do not include private conversations, personal data, API keys, or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who would benefit, and in what situation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the smallest useful version of the idea.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which part of the starter is this about?
      options:
        - iPhone app
        - Apple Watch app
        - Setup or documentation
        - Privacy or on-device AI
        - Other
    validations:
      required: true
